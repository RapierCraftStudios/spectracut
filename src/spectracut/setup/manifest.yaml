# Every bundled component, pinned. `spectracut setup` installs exactly the
# versions of the active tested set; `spectracut setup --upgrade` moves to the
# next set listed under `sets`. Add a set only after the whole set has been
# rendered end to end. Install snippets run on the target (sh on Linux,
# PowerShell on Windows); {version} is the pin.
components:
  blender:
    description: Blender 4.5 LTS (render hosts only; never the control plane)
    roles: [host]
    os: [linux, windows]
    version_cmd: {linux: "blender --version", windows: "blender --version"}
    install:
      linux: >-
        set -e; mkdir -p ~/.local/opt ~/.local/bin; f=$(mktemp);
        curl -fsSL https://download.blender.org/release/Blender4.5/blender-{version}-linux-x64.tar.xz -o "$f";
        want=$(curl -fsSL https://download.blender.org/release/Blender4.5/blender-{version}.sha256
        | grep 'blender-{version}-linux-x64.tar.xz$' | cut -d' ' -f1);
        echo "$want  $f" | sha256sum -c - && tar -xJ -C ~/.local/opt -f "$f" && rm -f "$f"
        && ln -sfn ~/.local/opt/blender-{version}-linux-x64/blender ~/.local/bin/blender
      windows: >-
        $ErrorActionPreference = 'Stop'; $d = Join-Path $env:USERPROFILE 'spectracut';
        New-Item -ItemType Directory -Force $d | Out-Null; $z = Join-Path $env:TEMP 'blender.zip';
        Invoke-WebRequest https://download.blender.org/release/Blender4.5/blender-{version}-windows-x64.zip -OutFile $z;
        $want = ((Invoke-WebRequest https://download.blender.org/release/Blender4.5/blender-{version}.sha256 -UseBasicParsing).Content
        -split "\r?\n" | Select-String -SimpleMatch 'blender-{version}-windows-x64.zip' | Select-Object -First 1).Line.Split(' ')[0];
        if ((Get-FileHash $z -Algorithm SHA256).Hash -ne $want) {{ throw 'Blender SHA-256 mismatch' }};
        Expand-Archive -Force $z $d; $b = Join-Path $d 'blender-{version}-windows-x64';
        $u = [Environment]::GetEnvironmentVariable('Path', 'User');
        if ($u -notlike "*$b*") {{ [Environment]::SetEnvironmentVariable('Path', "$b;$u", 'User') }}
  uv:
    description: uv, the Python tool installer that puts spectracut-host on a render host
    roles: [host]
    os: [linux, windows]
    version_cmd: {linux: "uv --version", windows: "uv.exe --version"}
    install:
      linux: >-
        set -e; mkdir -p ~/.local/bin; f=$(mktemp); u=https://github.com/astral-sh/uv/releases/download/{version};
        curl -fsSL $u/uv-x86_64-unknown-linux-gnu.tar.gz -o "$f";
        want=$(curl -fsSL $u/uv-x86_64-unknown-linux-gnu.tar.gz.sha256 | cut -d' ' -f1);
        echo "$want  $f" | sha256sum -c - && tar -xz --strip-components=1 -C ~/.local/bin -f "$f" && rm -f "$f"
      windows: >-
        $ErrorActionPreference = 'Stop'; $bin = Join-Path $env:USERPROFILE '.local/bin';
        New-Item -ItemType Directory -Force $bin | Out-Null; $z = Join-Path $env:TEMP 'uv.zip';
        $u = 'https://github.com/astral-sh/uv/releases/download/{version}';
        Invoke-WebRequest "$u/uv-x86_64-pc-windows-msvc.zip" -OutFile $z;
        $want = (Invoke-WebRequest "$u/uv-x86_64-pc-windows-msvc.zip.sha256" -UseBasicParsing).Content.Trim().Split(' ')[0];
        if ((Get-FileHash $z -Algorithm SHA256).Hash -ne $want) {{ throw 'uv SHA-256 mismatch' }};
        Expand-Archive -Force $z $bin
  spectracut-host:
    description: spectracut-host, the agent every `spectracut-shot` task runs (uv tool, pinned wheel)
    roles: [host]
    os: [linux, windows]
    version_cmd: {linux: "spectracut-host --help", windows: "spectracut-host.exe --help"}
    install:
      linux: >-
        $HOME/.local/bin/uv tool install --force --python 3.12 spectracut-host=={version}
      windows: >-
        & (Join-Path $env:USERPROFILE '.local/bin/uv.exe') tool install --force --python 3.12 spectracut-host=={version}
  flamenco-manager:
    description: Flamenco Manager on the control plane, listening on the Tailscale address only
    roles: [control]
    os: [linux]
    version_cmd: {linux: "flamenco-manager -version"}
    install:
      linux: >-
        set -e; mkdir -p ~/.local/opt/flamenco; f=$(mktemp);
        u=https://flamenco.blender.org/downloads/flamenco-{version}-linux-amd64.tar.gz;
        curl -fsSL $u -o "$f"; want=$(curl -fsSL $u.sha256 | cut -d' ' -f1);
        echo "$want  $f" | sha256sum -c - && tar -xz --strip-components=1 -C ~/.local/opt/flamenco -f "$f" && rm -f "$f"
  flamenco-worker:
    description: Flamenco Worker, native on every render host
    roles: [host]
    os: [linux, windows]
    version_cmd: {linux: "flamenco-worker -version", windows: "flamenco-worker.exe -version"}
    install:
      linux: >-
        set -e; mkdir -p ~/.local/opt/flamenco; f=$(mktemp);
        u=https://flamenco.blender.org/downloads/flamenco-{version}-linux-amd64.tar.gz;
        curl -fsSL $u -o "$f"; want=$(curl -fsSL $u.sha256 | cut -d' ' -f1);
        echo "$want  $f" | sha256sum -c - && tar -xz --strip-components=1 -C ~/.local/opt/flamenco -f "$f" && rm -f "$f"
      windows: >-
        $ErrorActionPreference = 'Stop'; $d = Join-Path $env:USERPROFILE 'spectracut';
        New-Item -ItemType Directory -Force $d | Out-Null; $z = Join-Path $env:TEMP 'flamenco.zip';
        $u = 'https://flamenco.blender.org/downloads/flamenco-{version}-windows-amd64.zip';
        Invoke-WebRequest $u -OutFile $z;
        $want = (Invoke-WebRequest "$u.sha256" -UseBasicParsing).Content.Trim().Split(' ')[0];
        if ((Get-FileHash $z -Algorithm SHA256).Hash -ne $want) {{ throw 'Flamenco SHA-256 mismatch' }};
        Expand-Archive -Force $z $d
  samba:
    description: Samba share for Flamenco storage (only on a Linux storage host)
    roles: [storage]
    os: [linux]
    version_cmd: {linux: "smbd --version"}
    install:
      linux: >-
        if command -v pacman >/dev/null; then sudo pacman -S --needed --noconfirm samba;
        else sudo apt-get install -y samba; fi
  ardour:
    description: Ardour DAW, driven headless from its Lua tool
    roles: [control]
    os: [linux]
    version_cmd: {linux: "ardour8-lua --version"}
    install:
      linux: >-
        if command -v pacman >/dev/null; then sudo pacman -S --needed --noconfirm ardour;
        else sudo apt-get install -y ardour; fi
  supercollider:
    description: SuperCollider for non-realtime synthesis
    roles: [control]
    os: [linux]
    version_cmd: {linux: "scsynth -v"}
    install:
      linux: >-
        if command -v pacman >/dev/null; then sudo pacman -S --needed --noconfirm supercollider;
        else sudo apt-get install -y supercollider; fi
  audio-plugins:
    description: LSP, x42, Airwindows, Dragonfly, Surge XT, IEM and the EBU ADM renderer
    roles: [control]
    os: [linux]
    version_cmd: {linux: "spectracut-plugins --version"}
    install:
      linux: >-
        if command -v pacman >/dev/null; then sudo pacman -S --needed --noconfirm lsp-plugins x42-plugins dragonfly-reverb surge-xt;
        else sudo apt-get install -y lsp-plugins x42-plugins dragonfly-reverb surge-xt; fi
  local-models:
    description: Local speech, sound-effect, music and vision models
    roles: [control]
    os: [linux]
    version_cmd: {linux: "spectracut-models --version"}
    install:
      linux: "spectracut-models fetch --set {version}"
  polyhaven-assets:
    description: Poly Haven CC0 HDRIs, materials and models
    roles: [control]
    os: [linux]
    version_cmd: {linux: "spectracut-assets version polyhaven"}
    install:
      linux: "spectracut-assets fetch polyhaven --snapshot {version}"
  ambientcg-assets:
    description: ambientCG CC0 materials
    roles: [control]
    os: [linux]
    version_cmd: {linux: "spectracut-assets version ambientcg"}
    install:
      linux: "spectracut-assets fetch ambientcg --snapshot {version}"
  addons:
    description: Bundled Blender add-ons (Camera Shakify, Rigify, MPFB2)
    roles: [host]
    os: [linux, windows]
    version_cmd: {linux: "spectracut-addons version", windows: "spectracut-addons.exe version"}
    install:
      linux: "spectracut-addons install --set {version}"
      windows: "spectracut-addons.exe install --set {version}"
sets:
  - id: "2026.11"
    versions:
      blender: "4.5.15"
      uv: "0.9.5"
      spectracut-host: "0.1.0"
      flamenco-manager: "3.9.3"
      flamenco-worker: "3.9.3"
      samba: "4.21"
      ardour: "8.12"
      supercollider: "3.13.1"
      audio-plugins: "2026.11"
      local-models: "2026.11"
      polyhaven-assets: "2026.11"
      ambientcg-assets: "2026.11"
      addons: "2026.11"
