[project]
name = "spectracut"
version = "0.0.0"
description = "An agent-run CGI studio."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "opentimelineio>=0.17,<0.19",
    "pydantic>=2.9,<3",
    "typer>=0.12",
]

[project.scripts]
spectracut = "spectracut.cli.app:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectracut"]

[tool.uv.workspace]
members = ["host"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/spectracut", "host/spectracut_host", "scripts", "tests"]
explicit_package_bases = true
mypy_path = ["src", "host"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opentimelineio", "opentimelineio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: real provider CLI calls; run only with SPECTRACUT_E2E=1",
]
