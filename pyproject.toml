[project]
name = "spectracut"
version = "0.0.0"
description = "An agent-run CGI studio."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "cryptography>=43",
    "mcp>=1.30,<2",
    "opentimelineio>=0.17,<0.19",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0",
    "starlette>=1.10,<2",
    "typer>=0.12",
]

[project.scripts]
spectracut = "spectracut.cli.app:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectracut"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/flamenco_enable_gpu.py" = "spectracut/setup/flamenco_enable_gpu.py"

[tool.uv.workspace]
members = ["host"]

[tool.uv.sources]
spectracut-host = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "spectracut-host",
    "types-pyyaml>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/spectracut", "host/spectracut_host", "scripts", "tests"]
explicit_package_bases = true
mypy_path = ["src", "host", "scripts/model_check"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opentimelineio", "opentimelineio.*"]
ignore_missing_imports = true

# Model packages used only by scripts/model_check, installed in per-host venvs on legion (#49).
[[tool.mypy.overrides]]
module = [
    "torch", "torch.*", "torchaudio", "torchaudio.*", "transformers", "transformers.*",
    "diffusers", "diffusers.*", "kokoro", "kokoro.*", "soundfile", "librosa", "librosa.*",
    "faster_whisper", "faster_whisper.*", "bitsandbytes", "bitsandbytes.*",
    "acestep", "acestep.*", "huggingface_hub", "huggingface_hub.*", "numpy", "numpy.*",
    "qwen_tts", "qwen_tts.*", "api", "api.*", "stable_audio_tools", "stable_audio_tools.*",
    "einops", "accelerate", "accelerate.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: real provider CLI calls; run only with SPECTRACUT_E2E=1",
]
