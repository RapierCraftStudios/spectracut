name: CLA

# Report-only until the repository variable CLA_ENFORCE is set to 'true' (see #10).
# SAFETY: pull_request_target runs with a write token, so this workflow must never
# check out or execute pull-request code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA check
        id: cla
        continue-on-error: ${{ vars.CLA_ENFORCE != 'true' }}
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: "dependabot[bot],github-actions[bot],*[bot]"
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
      - name: Report-only notice
        if: steps.cla.outcome == 'failure'
        run: echo "::warning::CLA not signed by every author. The check is report-only until the repository variable CLA_ENFORCE is 'true' (issue #10)."
