# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release

# Tagging vX.Y.Z builds every package and image. Publishing is a dry run until the
# repository variable PUBLISH_ENABLED is set to 'true' (trusted publishing, see #9).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ vars.PUBLISH_ENABLED == 'true' && github.ref_type == 'tag' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches package versions
        if: github.ref_type == 'tag'
        run: python scripts/check_release_version.py "${GITHUB_REF_NAME}"
      - name: Resolve version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  python:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build wheels and sdists
        run: |
          uv build --out-dir dist
          uv build --package spectracut-host --out-dir dist
      - name: Smoke test the built wheel
        run: |
          pipx install dist/spectracut-*.whl
          spectracut --version
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Publish to PyPI
        if: env.PUBLISH == 'true'
        run: uv publish --trusted-publishing always dist/*
      - name: Dry run
        if: env.PUBLISH != 'true'
        run: echo "Dry run, not publishing to PyPI:" && ls dist

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build --workspace @spectracut/capture
      - name: Publish @spectracut/capture
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${PUBLISH}" = "true" ]; then
            npm publish --workspace @spectracut/capture --provenance --access public
          else
            npm publish --workspace @spectracut/capture --dry-run
          fi

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: spectracut-api
            dockerfile: docker/Dockerfile.api
          - image: spectracut-host
            dockerfile: docker/Dockerfile.host
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.name.outputs.repo }}:${{ needs.verify.outputs.version }}
            ${{ steps.name.outputs.repo }}:latest
