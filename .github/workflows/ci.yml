name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "milestone/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: SPDX headers
        run: uv run python scripts/check_spdx.py
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Schema compatibility
        run: uv run python scripts/check_schema_compat.py
      - name: Pytest
        run: uv run pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: tsc
        run: npx tsc -p packages/capture/tsconfig.json --noEmit
      - name: ESLint
        run: npx eslint .
      - name: Vitest
        run: npx vitest run
