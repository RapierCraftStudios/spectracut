name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "milestone/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: SPDX headers
        run: uv run python scripts/check_spdx.py
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Schema compatibility
        run: uv run python scripts/check_schema_compat.py
      - name: Pytest
        run: uv run pytest -q

  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Manifest URLs resolve
        run: SPECTRACUT_NETWORK=1 uv run pytest -q tests/setup/test_manifest_urls.py

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: tsc
        run: npx tsc -p packages/capture/tsconfig.json --noEmit
      - name: ESLint
        run: npx eslint .
      - name: Vitest
        run: npx vitest run
      - name: Install Chromium for capture e2e
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: Capture e2e (headless Chromium)
        run: SPECTRACUT_E2E=1 npx vitest run packages/capture/test/capture.e2e.test.ts
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install Python env for review e2e
        run: uv sync --locked
      - name: Review page e2e (headless Chromium against spectracut serve)
        run: SPECTRACUT_E2E=1 npx vitest run apps/review/test/review.e2e.test.ts

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/Dockerfile.api
          - image: host
            dockerfile: docker/Dockerfile.host
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
