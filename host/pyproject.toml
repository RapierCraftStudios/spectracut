[project]
name = "spectracut-host"
version = "0.0.0"
description = "SpectraCut render host agent (runs next to Blender on GPU hosts)."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "spectracut",
]

# One extra per local model family (spectracut.providers.local.registry). ``spectracut
# setup`` installs all of them into the spectracut-host tool venv on the model host, with
# CUDA torch from the PyTorch cu128 index (spectracut.setup.plan). Measured pins:
# transformers 5.0.0 (scripts/model_check/sfx_moss.py; later releases break MOSS), shared
# by every family so all nine install into one venv; torch 2.11.0 is the newest build on
# the cu128 index for Windows. The rest are exact pins of the releases current at the time
# of #296. llama-cpp runs the llama.cpp b12110 release binary (setup.model_assets).
[project.optional-dependencies]
ezaudio = [
    "torch==2.11.0", "torchaudio==2.11.0", "transformers==5.0.0", "einops==0.8.2",
    "soundfile==0.14.0", "huggingface-hub==1.33.0",
]
moss-sfx = [
    "torch==2.11.0", "torchaudio==2.11.0", "transformers==5.0.0", "accelerate==1.15.0",
    "bitsandbytes==0.50.2", "soundfile==0.14.0", "huggingface-hub==1.33.0",
]
hunyuan-foley = [
    "torch==2.11.0", "torchaudio==2.11.0", "torchvision==0.26.0", "transformers==5.0.0",
    "diffusers==0.42.1", "accelerate==1.15.0", "einops==0.8.2", "soundfile==0.14.0",
    "huggingface-hub==1.33.0", "loguru==0.7.3", "av==19.0.2", "descript-audiotools==0.7.2",
    "pyyaml==6.0.3", "pillow==13.0.0", "tqdm==4.70.1", "sentencepiece==0.2.3",
    "omegaconf==2.4.0", "easydict==1.13", "timm==1.0.31", "numpy==2.5.4",
]
ace-step = [
    "torch==2.11.0", "torchaudio==2.11.0", "transformers==5.0.0", "diffusers==0.42.1",
    "accelerate==1.15.0", "soundfile==0.14.0", "huggingface-hub==1.33.0",
]
kokoro = [
    "torch==2.11.0", "kokoro==0.9.4; python_version < '3.13'", "soundfile==0.14.0",
    "huggingface-hub==1.33.0",
]
llama-cpp = ["soundfile==0.14.0", "huggingface-hub==1.33.0"]
diffusers-gguf = [
    "torch==2.11.0", "transformers==5.0.0", "diffusers==0.42.1", "accelerate==1.15.0",
    "gguf==0.19.0", "huggingface-hub==1.33.0",
]
faster-whisper = ["faster-whisper==1.2.1", "soundfile==0.14.0", "huggingface-hub==1.33.0"]
clap = [
    "torch==2.11.0", "torchaudio==2.11.0", "transformers==5.0.0", "soundfile==0.14.0",
    "huggingface-hub==1.33.0",
]

[project.scripts]
spectracut-host = "spectracut_host.agent:main"

[tool.uv.sources]
spectracut = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# bpy_runtime ships next to spectracut_host: the guard reads its files (never imports
# it; spectracut._bpy_guard blocks that) and Blender imports it from site-packages.
packages = ["spectracut_host", "bpy_runtime"]
