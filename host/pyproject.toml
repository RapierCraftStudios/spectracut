[project]
name = "spectracut-host"
version = "0.0.0"
description = "SpectraCut render host agent (runs next to Blender on GPU hosts)."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# bpy_runtime runs inside Blender only and is deliberately not packaged.
packages = ["spectracut_host"]
