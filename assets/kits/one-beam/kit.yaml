# One Beam lookdev kit (#346, part A of #341).
# Every entry is an original parameterised macro of existing harness build calls,
# expanded by spectracut.harness.kit before compile. Kit files stage at
# kits/one-beam/<path> in a render's assets dir. Distances are metres; +Z is up and
# the camera looks from -Y. Colour params are '#rrggbb' palette swatches.
id: one-beam
title: One Beam lookdev kit
summary: >-
  Bevelled glass tiers, a beam with a hot core and a glow shell, a cable knot, an
  engraved readout slab and a generic unbranded device stage, lit by an original
  studio-softbox HDRI and rig presets.

files:
  - path: hdri/studio-softbox.hdr
    sha256: f2e6004b5dade280fc7c429145d5c3dfe191027f51825079f4ee101f45dc0154
    license: hdri/studio-softbox.hdr.license.json
    provenance:
      origin: original
      author: SpectraCut (RapierCraft Studios)
      source: generated by scripts/make_one_beam_hdri.py

entries:
  glass_tiers:
    kind: asset
    summary: >-
      Five stacked bevelled glass slabs, widest at the bottom, with small gaps so a
      rim light draws every edge. Objects <name>_tier_1 (bottom) .. <name>_tier_5;
      the stack is 0.62 m tall, its base at the entry location.
    params:
      name: {type: string, default: glass_stack, max_length: 40, description: object name prefix}
      glass: {type: string, default: clear_glass, choices: [clear_glass, frosted_glass, smoked_glass, glass]}
      tint: {type: color, default: "#eef3f8", description: glass tint swatch}
      roughness: {type: number, default: 0.04, min: 0, max: 1}
    calls:
      - {tool: object.add_slab, args: {name: "${name}_tier_1", dimensions: [1.6, 1.0, 0.1], bevel_width: 0.02, segments: 4, location: [0, 0, 0.05]}}
      - {tool: object.add_slab, args: {name: "${name}_tier_2", dimensions: [1.45, 0.9, 0.1], bevel_width: 0.02, segments: 4, location: [0, 0, 0.18]}}
      - {tool: object.add_slab, args: {name: "${name}_tier_3", dimensions: [1.3, 0.8, 0.1], bevel_width: 0.02, segments: 4, location: [0, 0, 0.31]}}
      - {tool: object.add_slab, args: {name: "${name}_tier_4", dimensions: [1.15, 0.7, 0.1], bevel_width: 0.02, segments: 4, location: [0, 0, 0.44]}}
      - {tool: object.add_slab, args: {name: "${name}_tier_5", dimensions: [1.0, 0.6, 0.1], bevel_width: 0.02, segments: 4, location: [0, 0, 0.57]}}
      - {tool: material.apply_preset, args: {object: "${name}_tier_1", preset: "${glass}", color: "${tint|linear}", roughness: "${roughness}"}}
      - {tool: material.apply_preset, args: {object: "${name}_tier_2", preset: "${glass}", color: "${tint|linear}", roughness: "${roughness}"}}
      - {tool: material.apply_preset, args: {object: "${name}_tier_3", preset: "${glass}", color: "${tint|linear}", roughness: "${roughness}"}}
      - {tool: material.apply_preset, args: {object: "${name}_tier_4", preset: "${glass}", color: "${tint|linear}", roughness: "${roughness}"}}
      - {tool: material.apply_preset, args: {object: "${name}_tier_5", preset: "${glass}", color: "${tint|linear}", roughness: "${roughness}"}}
    provenance: {origin: original, author: SpectraCut (RapierCraft Studios), source: authored for assets/kits/one-beam (#346)}

  beam:
    kind: asset
    summary: >-
      A vertical light beam centred on the entry location: a thin white-hot core
      (<name>_core), the beam body in the beam colour (<name>) and a wide frosted
      glow shell (<name>_glow) that reads as volumetric glow without haze, plus a
      point light (<name>_light) so the beam lights its surroundings.
    params:
      name: {type: string, default: beam, max_length: 40}
      color: {type: color, default: "#4f8cff", description: beam swatch (use a palette swatch)}
      core_color: {type: color, default: "#ffffff", description: hot core swatch (use the palette's lightest)}
      length: {type: number, default: 3.0, min: 0.2, max: 50}
      core_strength: {type: number, default: 30, min: 0.5, max: 200}
      body_strength: {type: number, default: 8, min: 0.1, max: 100}
      glow_strength: {type: number, default: 0.6, min: 0, max: 20}
      light_energy: {type: number, default: 150, min: 0, max: 100000}
    calls:
      - {tool: object.add_slab, args: {name: "${name}_core", dimensions: [0.012, 0.012, "${length}"], bevel_width: 0.005, segments: 2, location: [0, 0, 0]}}
      - {tool: object.add_slab, args: {name: "${name}", dimensions: [0.04, 0.04, "${length}"], bevel_width: 0.018, segments: 4, location: [0, 0, 0]}}
      - {tool: object.add_slab, args: {name: "${name}_glow", dimensions: [0.2, 0.2, "${length}"], bevel_width: 0.09, segments: 6, location: [0, 0, 0]}}
      - {tool: material.apply_preset, args: {object: "${name}_core", preset: emissive, color: "${core_color|linear}", emission_strength: "${core_strength}"}}
      - {tool: material.apply_preset, args: {object: "${name}", preset: emissive, color: "${color|linear}", emission_strength: "${body_strength}"}}
      - {tool: material.apply_preset, args: {object: "${name}_glow", preset: frosted_glass, color: "${color|linear}", roughness: 0.6, emission_color: "${color|linear}", emission_strength: "${glow_strength}"}}
      - {tool: light.add, args: {name: "${name}_light", kind: point, energy: "${light_energy}", color: "${color|linear}", location: [0, 0, 0]}}
    provenance: {origin: original, author: SpectraCut (RapierCraft Studios), source: authored for assets/kits/one-beam (#346)}

  cable_knot:
    kind: asset
    summary: >-
      A closed trefoil cable knot (<name>), a bevelled tube about 0.66 m across
      floating 0.2 m above the entry location, with micro bump detail.
    params:
      name: {type: string, default: cable_knot, max_length: 40}
      thickness: {type: number, default: 0.035, min: 0.005, max: 0.2, description: tube radius in m}
      preset: {type: string, default: glossy_plastic, choices: [glossy_plastic, rubber, brushed_metal, polished_metal, anodised_metal, ceramic]}
      color: {type: color, default: "#1c1f26"}
      seed: {type: integer, default: 7, min: 0, max: 2147483647}
    calls:
      - {tool: curve.add, args: {name: "${name}", kind: bezier, cyclic: true, bevel_depth: "${thickness}", bevel_resolution: 6, resolution: 24, points: [[0, -0.06, 0.2], [0.1511, -0.0319, 0.1151], [0.2678, 0.0439, 0.08], [0.3249, 0.1449, 0.1151], [0.3118, 0.24, 0.2], [0.2359, 0.2989, 0.2849], [0.12, 0.3, 0.32], [-0.0041, 0.2368, 0.2849], [-0.1039, 0.12, 0.2], [-0.1551, -0.0249, 0.1151], [-0.1478, -0.1639, 0.08], [-0.0889, -0.2638, 0.1151], [0, -0.3, 0.2], [0.0889, -0.2638, 0.2849], [0.1478, -0.1639, 0.32], [0.1551, -0.0249, 0.2849], [0.1039, 0.12, 0.2], [0.0041, 0.2368, 0.1151], [-0.12, 0.3, 0.08], [-0.2359, 0.2989, 0.1151], [-0.3118, 0.24, 0.2], [-0.3249, 0.1449, 0.2849], [-0.2678, 0.0439, 0.32], [-0.1511, -0.0319, 0.2849]]}}
      - {tool: material.apply_preset, args: {object: "${name}", preset: "${preset}", color: "${color|linear}", roughness: 0.3, bump_kind: noise, bump_strength: 0.08, bump_scale: 220, seed: "${seed}"}}
    provenance: {origin: original, author: SpectraCut (RapierCraft Studios), source: authored for assets/kits/one-beam (#346)}

  readout_slab:
    kind: asset
    summary: >-
      An upright bevelled metal plate (<name>_plate) facing the camera with the
      body engraved through it (<name>, text.add cutout; the body must be allowed
      copy, verbatim) and a raking strip light (<name>_rake) above it. The plate is
      1.4 x 0.5 m, its base at the entry location.
    params:
      name: {type: string, default: readout, max_length: 40}
      body: {type: string, default: "00:00", max_length: 500, description: "allowed on-screen copy, verbatim"}
      text_size: {type: number, default: 0.16, min: 0.02, max: 2}
      preset: {type: string, default: anodised_metal, choices: [anodised_metal, brushed_metal, polished_metal, ceramic, matte_plastic, glossy_plastic]}
      color: {type: color, default: "#2a2d33"}
      light_energy: {type: number, default: 120, min: 0, max: 100000}
    calls:
      - {tool: object.add_slab, args: {name: "${name}_plate", dimensions: [1.4, 0.12, 0.5], bevel_width: 0.015, segments: 4, location: [0, 0, 0.25]}}
      - {tool: text.add, args: {name: "${name}", body: "${body}", mode: cutout, plate: "${name}_plate", size: "${text_size}", align: center, location: [0, -0.06, 0.2], rotation: [1.5708, 0, 0]}}
      - {tool: material.apply_preset, args: {object: "${name}_plate", preset: "${preset}", color: "${color|linear}", roughness: 0.35, brushing: 0.4, edge_wear: 0.3, seed: 11}}
      - {tool: light.add, args: {name: "${name}_rake", kind: area, energy: "${light_energy}", size: 0.4, location: [0, -0.6, 0.85], rotation: [1.0, 0, 0]}}
    provenance: {origin: original, author: SpectraCut (RapierCraft Studios), source: authored for assets/kits/one-beam (#346)}

  device_stage:
    kind: asset
    summary: >-
      A generic, unbranded device stage: a bevelled plinth (<name>_plinth, top at
      the entry location), a seamless backdrop wall (<name>_backdrop) behind it and
      an upright slate device (<name>_device) with a softly lit screen
      (<name>_screen) facing the camera. No logos or OEM marks.
    params:
      name: {type: string, default: stage, max_length: 40}
      surface: {type: color, default: "#d9d6d0", description: plinth swatch}
      backdrop: {type: color, default: "#15171c", description: backdrop swatch}
      device_color: {type: color, default: "#3a3d44"}
      screen_color: {type: color, default: "#0b0d12"}
      screen_strength: {type: number, default: 0.4, min: 0, max: 20}
    calls:
      - {tool: object.add_slab, args: {name: "${name}_plinth", dimensions: [2.4, 1.6, 0.2], bevel_width: 0.03, segments: 4, location: [0, 0, -0.1]}}
      - {tool: object.add_slab, args: {name: "${name}_backdrop", dimensions: [8, 0.1, 4], bevel_width: 0.02, segments: 2, location: [0, 2.2, 1.6]}}
      - {tool: object.add_slab, args: {name: "${name}_device", dimensions: [1.2, 0.06, 0.8], bevel_width: 0.025, segments: 6, location: [0, 0, 0.42]}}
      - {tool: object.add_slab, args: {name: "${name}_screen", dimensions: [1.12, 0.006, 0.72], bevel_width: 0.002, segments: 1, location: [0, -0.031, 0.42]}}
      - {tool: material.apply_preset, args: {object: "${name}_plinth", preset: ceramic, color: "${surface|linear}", roughness: 0.45}}
      - {tool: material.apply_preset, args: {object: "${name}_backdrop", preset: matte_plastic, color: "${backdrop|linear}", roughness: 0.9}}
      - {tool: material.apply_preset, args: {object: "${name}_device", preset: anodised_metal, color: "${device_color|linear}", roughness: 0.3, edge_wear: 0.2, seed: 5}}
      - {tool: material.apply_preset, args: {object: "${name}_screen", preset: emissive, color: "${screen_color|linear}", emission_strength: "${screen_strength}"}}
    provenance: {origin: original, author: SpectraCut (RapierCraft Studios), source: authored for assets/kits/one-beam (#346)}

  studio_softbox:
    kind: lighting
    summary: >-
      World lit by the kit's original studio-softbox HDRI (warm key softbox, cool
      fill, overhead panel, rim strip) plus a product_softbox rig aimed at the
      entry location + [0, 0, 0.3]. Use instead of a world gradient.
    params:
      hdri_strength: {type: number, default: 0.8, min: 0, max: 10}
      hdri_rotation: {type: number, default: 0, min: -360, max: 360}
      power: {type: number, default: 1.0, min: 0.1, max: 100}
      distance: {type: number, default: 4.0, min: 0.5, max: 100}
    calls:
      - {tool: world.set_hdri, args: {path: "${file:hdri/studio-softbox.hdr}", sha256: "${sha256:hdri/studio-softbox.hdr}", strength: "${hdri_strength}", rotation: "${hdri_rotation}"}}
      - {tool: light.add, args: {rig: product_softbox, target: [0, 0, 0.3], power: "${power}", distance: "${distance}"}}
    provenance: {origin: original, author: SpectraCut (RapierCraft Studios), source: authored for assets/kits/one-beam (#346)}

  rim_key:
    kind: lighting
    summary: >-
      A key and fill (key_fill rig) plus two rims behind the subject (rim_area rig),
      all aimed at the entry location + [0, 0, 0.3]. Pairs with a palette world
      gradient or studio_softbox; raise rim_power to draw glass edges.
    params:
      key_power: {type: number, default: 1.0, min: 0.1, max: 100}
      rim_power: {type: number, default: 1.5, min: 0.1, max: 100}
      distance: {type: number, default: 4.0, min: 0.5, max: 100}
    calls:
      - {tool: light.add, args: {rig: key_fill, target: [0, 0, 0.3], power: "${key_power}", distance: "${distance}"}}
      - {tool: light.add, args: {rig: rim_area, target: [0, 0, 0.3], power: "${rim_power}", distance: "${distance}"}}
    provenance: {origin: original, author: SpectraCut (RapierCraft Studios), source: authored for assets/kits/one-beam (#346)}
